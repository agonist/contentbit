packages: []

allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  msw: false

# Starters intentionally track the just-published @contentbit/* release, so the
# default supply-chain release-age delay works against their purpose. Disable it
# here rather than chasing a per-version exclude list on every release.
minimumReleaseAge: 0
