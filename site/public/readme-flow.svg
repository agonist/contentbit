<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">contentbit product flow</title>
  <desc id="desc">A three-step flow showing a programmatic SEO page contract, an agent-ready brief, and a clean content quality gate.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="54%">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#07110d"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#ffffff" stroke-opacity="0.13"/>
  <rect x="1159" y="34" width="7" height="562" fill="#10b981"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <text x="72" y="86" fill="#ffffff" font-size="31" font-weight="760" letter-spacing="-1.5">contentbit</text>
    <rect x="72" y="106" width="118" height="4" fill="url(#emerald)"/>
    <text x="748" y="84" fill="#f6fff9" fill-opacity="0.56" font-size="16" letter-spacing="2.2">PLAN -&gt; BRIEF -&gt; VALIDATE</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="165" fill="#ffffff" font-size="54" font-weight="760" letter-spacing="-2.5">Programmatic SEO for agents</text>
    <text x="72" y="207" fill="#cbd5d1" font-size="22">plan page families, brief writers, and catch drift before publishing.</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="72" y="262" width="314" height="228" rx="10" fill="#0c1712" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="72" y="262" width="314" height="48" rx="10" fill="#111d17"/>
    <circle cx="96" cy="286" r="6" fill="#ef6f6c"/>
    <circle cx="116" cy="286" r="6" fill="#e7b84b"/>
    <circle cx="136" cy="286" r="6" fill="#34d399"/>
    <text x="158" y="292" fill="#f6fff9" fill-opacity="0.58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">page family</text>
    <text x="100" y="345" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">alternative</text>
    <text x="100" y="382" fill="#aeb9b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">sections: overview, faq</text>
    <text x="100" y="419" fill="#aeb9b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">block: comparison</text>
    <text x="100" y="456" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">links: 2 required</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="443" y="262" width="314" height="228" rx="10" fill="#0c1712" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="443" y="262" width="314" height="48" rx="10" fill="#111d17"/>
    <text x="470" y="292" fill="#f6fff9" fill-opacity="0.58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">contentbit brief</text>
    <rect x="476" y="332" width="126" height="29" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <text x="492" y="353" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">agent-ready</text>
    <text x="476" y="393" fill="#f6fff9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">target + intent</text>
    <text x="476" y="424" fill="#aeb9b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">sections + blocks</text>
    <text x="476" y="455" fill="#aeb9b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">links + acceptance</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="814" y="262" width="314" height="228" rx="10" fill="#0c1712" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="814" y="262" width="314" height="48" rx="10" fill="#111d17"/>
    <text x="842" y="292" fill="#f6fff9" fill-opacity="0.58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">contentbit doctor</text>
    <text x="842" y="349" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">0 required findings</text>
    <text x="842" y="387" fill="#d7e0db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">sections       3 / 3</text>
    <text x="842" y="420" fill="#d7e0db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">blocks         2 / 2</text>
    <text x="842" y="453" fill="#d7e0db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">links     4 resolved</text>
  </g>

  <g fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M399 376 H426"/>
    <path d="M418 368 L426 376 L418 384"/>
    <path d="M770 376 H797"/>
    <path d="M789 368 L797 376 L789 384"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700">
    <rect x="72" y="532" width="172" height="38" rx="7" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.13"/>
    <text x="91" y="557" fill="#d7e0db">page contracts</text>
    <rect x="260" y="532" width="158" height="38" rx="7" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.13"/>
    <text x="279" y="557" fill="#d7e0db">agent briefs</text>
    <rect x="434" y="532" width="158" height="38" rx="7" fill="#10b981"/>
    <text x="453" y="557" fill="#03110c">strict checks</text>
  </g>
</svg>
