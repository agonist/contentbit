name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:packages

  starter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        starter: [starter/astro, starter/tanstack]
    defaults:
      run:
        working-directory: ${{ matrix.starter }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.starter }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
